<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enigma Hacker - Level 04</title>

    <link rel="shortcut icon" href="../img/logo.png" type="image/x-icon">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300&display=swap');

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
            font-family: "Fira Code", monospace;
            color: #009919;
        }

        .enigma {
            text-align: center;
            background-color: #000000;
            padding: 20px;
            border: 2px solid #00FF00;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 80%;
        }

        h1 {
            font-size: 24px;
            margin: 0;
            padding: 10px 0;
        }

        h3 {
            font-size: 18px;
            margin: 0;
        }

        p #palavraEmbaralhada {
            font-size: 30pt;
            margin: 20px 0;
            font-weight: bold;
            color: #00FF00;
            text-shadow: 2px 2px 4px #000000;
        }

        p #dica {
            font-size: 18px;
        }

        input[type="password"] {
            padding: 10px;
            margin: 10px;
            font-size: 16px;
            width: 90%;
            border: 2px solid #00FF00;
            border-radius: 5px;
            text-align: center;

            background-color: #000000;
            color: #fff;

            margin-bottom: 30px;
        }

        button {
            background-color: #000000;
            color: #009919;
            border: 2px solid #00FF00;
            border-radius: 20px;
            cursor: pointer;
            font-size: 20px;
            padding: 10px 20px;
            width: 100%;
            transition: background-color 0.3s, transform 0.3s, box-shadow 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #00FF00;
        }
    </style>
</head>

<body>
    <div class="enigma">
        <h1>Desafio 04</h1>
        <h3>Descubra a senha para prosseguir...</h3>

        <input type="password" id="resposta">
        <button id="verificar">Verificar</button>

        <p id="dica">Dica: Observe sempre em sua volta...</p>
    </div>

    <script>
        const respostaInput=document.getElementById("resposta"),verificarButton=document.getElementById("verificar"),respostaCorreta="404";var tentativa=1;verificarButton.addEventListener("click",function(){let e=respostaInput.value.toUpperCase();"404"===e?(window.alert("[ ⚠ ATEN\xc7\xc3O ] Resposta correta, voc\xea resolveu 4/5 desafios, guarde em sua mem\xf3ria este n\xfamero '5' para utiliz\xe1-lo no final do enigma! Clique em 'Ok' para avan\xe7ar"),window.location.href="./nivel05"):(tentativa<3?(window.alert(`❌ Voc\xea digitou a resposta incorreta, essa foi sua ${tentativa}/3 tentativas! Cuidado, ao perder voc\xea volta ao come\xe7o!`),tentativa++):(window.alert("\uD83D\uDD04 Voc\xea atingiu 3 erros! Portanto, voc\xea retornou ao come\xe7o!"),window.location.href="../../index"),respostaInput.value="")});
    </script>

    <script src="../js/bloquearCoisas.js"></script>
</body>

</html>
